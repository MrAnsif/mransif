name: Update profile art

# Refreshes the contribution graph + stats card SVGs daily from real data.
# Runs daily, plus whenever you push to main, plus on-demand.

"on":
  schedule:
    - cron: "17 6 * * *"   # ~06:17 UTC every day
  workflow_dispatch: {}
  push:
    branches: [main, master, ui-v2]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Scrape real contribution data (no auth needed)
        run: python scripts/fetch_contributions.py
        env:
          GH_PROFILE_USER: mransif

      - name: Render animated contribution graph SVG
        run: python scripts/generate_streak_svg.py mransif contrib-heatmap.svg

      - name: Render README cards (hero, tiles, activity, repos, blue graph)
        run: python scripts/render_readme_cards.py

      - name: Fetch LeetCode submission data
        run: python scripts/fetch_leetcode.py
        env:
          LEETCODE_USER: ansif01

      - name: Render LeetCode heatmap SVG
        run: python scripts/render_leetcode_heatmap.py

      - name: Commit updated art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile art [skip ci]"
          file_pattern: "data/contributions.json data/leetcode.json contrib-heatmap.svg cards/*.svg"

